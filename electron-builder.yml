appId: com.shellpilot.app
productName: ShellPilot
directories:
  output: release
files:
  - dist/main/**
  - dist/renderer/**
  - dist/preload/**
  - package.json
extraMetadata:
  main: dist/main/index.js
win:
  target:
    - nsis
  icon: build/icon.png
  sign: false
  signingHashAlgorithms: []

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dmg
  icon: build/icon.png
linux:
  target:
    - AppImage
  icon: build/icon.png
