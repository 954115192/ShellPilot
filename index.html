<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShellPilot</title>

      * {

    <div id="app"></div>
    <script type="module" src="/src/renderer/main.ts"></script>
